events {}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # 1. FIX: Disable sendfile for Docker volume stability
    sendfile off;

    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /api/ {
            proxy_pass http://backend:8000;
        }

        # 2. FIX: Use root instead of alias
        location /downloads {
            root /;
            autoindex on;
        }
    }
}
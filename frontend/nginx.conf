pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    # It's good practice to explicitly set worker connections
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    include       mime.types;
    default_type  application/octet-stream;

    # Set temp paths to writable locations for non-root user
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # CRITICAL: Enable highly efficient file streaming
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Optional but recommended: Keep connections alive to prevent client drops
    keepalive_timeout 65;

    server {
        listen 8080;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /api/ {
            proxy_pass http://backend:8000;

            # 1. Enable buffering so Nginx handles the heavy lifting, freeing your backend
            proxy_buffering on;

            # 2. Allow Nginx to buffer large files to disk
            proxy_max_temp_file_size 10240m; # Adjust based on your largest file size (e.g., 10GB)
            proxy_buffers 16 16k;
            proxy_buffer_size 32k;

            # 3. Increase timeouts for large file generation/transfer
            proxy_read_timeout 600s;
            proxy_connect_timeout 90s;
            proxy_send_timeout 600s;
        }

        # This path must match the X-Accel-Redirect header
        location /protected-downloads/ {
            internal;

            # This maps the internal URI to the actual folder on Nginx's filesystem
            alias /downloads/;
        }
    }
}
events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile off;

    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /api/ {
            proxy_pass http://backend:8000;

            # CRITICAL FOR FILE DOWNLOADS:
            # 1. Disable buffering so the download starts immediately
            proxy_buffering off;
            # 2. Increase timeout so Nginx doesn't cut off long downloads (e.g. 10 mins)
            proxy_read_timeout 600s;
        }

        # REMOVED: location /downloads block is no longer needed
    }
}
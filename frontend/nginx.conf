events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        # 1. Serve the HTML Interface
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # 2. Proxy API requests to the Python Backend
        location /api/ {
            proxy_pass http://backend:8000;
        }

        # 3. Serve the downloaded video files directly
        location /downloads/ {
            alias /downloads/;
            autoindex on; # Allows listing files if you browse to /downloads/
        }
    }
}
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {}

http {
    access_log /var/log/nginx/access.log;
    include       mime.types;
    default_type  application/octet-stream;

    # Set temp paths to writable locations for non-root user
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile off;

    server {
        listen 8080;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /api/ {
            proxy_pass http://backend:8000;

            # CRITICAL FOR FILE DOWNLOADS:
            # 1. Disable buffering so the download starts immediately
            proxy_buffering off;
            # 2. Increase timeout so Nginx doesn't cut off long downloads (e.g. 10 mins)
            proxy_read_timeout 600s;
        }

    }
}
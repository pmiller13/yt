<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Ad Scrubber</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f4f4f9;
            /* Creates a 100px "safe zone" at the bottom of the page.
               Your "Read" extension will sit in this empty space 
               instead of hugging your content.
            */
            padding-bottom: 100px;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background: #0070f3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover {
            background: #0051a2;
        }

        #status {
            margin-top: 15px;
            color: #666;
            text-align: center;
        }

        .file-list {
            margin-top: 2rem;
        }

        .file-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-item a {
            color: #0070f3;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>YouTube Ad Scrubber</h2>
        <input type="text" id="urlInput" placeholder="Paste YouTube URL here...">
        <button onclick="scrub()">Download & Scrub</button>
        <div id="status"></div>
    </div>

    <div class="card file-list" id="fileList">
        <h3>Downloads</h3>
    </div>

    <script>
        async function scrub() {
            const urlInput = document.getElementById('urlInput');
            const status = document.getElementById('status');
            const url = urlInput.value.trim(); // FIXED: .trim() removes mobile whitespace

            if (!url) return;

            status.textContent = "🚀 Sending request...";

            try {
                const res = await fetch('/yt/api/scrub', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                // FIXED: Check if the response is actually JSON before parsing
                const contentType = res.headers.get("content-type");
                if (contentType && contentType.indexOf("application/json") !== -1) {
                    const data = await res.json();

                    if (!res.ok) {
                        // Handle JSON error from server (e.g. { error: "Invalid URL" })
                        throw new Error(data.message || data.error || "Server Error");
                    }

                    status.textContent = "✅ " + data.message + " (Check back in a few minutes)";
                    refreshFiles();
                } else {
                    // Handle non-JSON response (The "Position 4" fix)
                    const text = await res.text();
                    throw new Error(`Server returned non-JSON error: ${text}`);
                }

            } catch (e) {
                console.error(e);
                status.textContent = "❌ Error: " + e.message;
            }
        }

        async function refreshFiles() {
            const res = await fetch('/yt/api/files');
            const data = await res.json();
            const list = document.getElementById('fileList');
            // Keep header, clear list
            list.innerHTML = '<h3>Recent Downloads</h3>';

            data.files.forEach(file => {
                const div = document.createElement('div');
                div.className = 'file-item';
                // Removed emoji here too, just clean text
                div.innerHTML = `<span>${file}</span> <a href="/downloads/${encodeURIComponent(file)}" download>Save</a>`;
                list.appendChild(div);
            });
        }

        // Poll for new files every 5 seconds
        setInterval(refreshFiles, 5000);
        refreshFiles();
    </script>
</body>

</html>
